name: goldens

# Build the golden standard cells on every push / PR and fail if any is not
# DRC/LVS-clean. This is the regression gate for the generator.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone the lclayout P&R engine
        run: |
          git clone https://codeberg.org/tok/librecell.git lclayout || \
          git clone https://github.com/tok/librecell.git lclayout

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # apply our tracked patches to the engine, then install it editable
          if ls patches/*.patch >/dev/null 2>&1; then (cd lclayout && git apply ../patches/*.patch || true); fi
          pip install -e ./lclayout

      - name: Build golden cells (DRC/LVS gate)
        env:
          PYTHONHASHSEED: "42"     # lclayout has residual nondeterminism; pin it
        run: bash tests/run_goldens.sh
